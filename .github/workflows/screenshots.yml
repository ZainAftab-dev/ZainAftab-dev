name: Update screenshots

# Captures the live portfolio, agency and hospital-system sites for the profile README.
# Runs when this file changes, every Monday, or manually from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
    paths: [.github/workflows/screenshots.yml]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          mkdir -p /tmp/shot && cd /tmp/shot
          npm init -y >/dev/null
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Take screenshots
        run: |
          cat > /tmp/shot/shoot.js <<'JS'
          const { chromium } = require('playwright');
          const out = process.env.GITHUB_WORKSPACE + '/assets/';
          const sites = [
            { file: 'portfolio.jpg', url: 'https://zainaftab-dev.vercel.app' },
            { file: 'agency.jpg', url: 'https://strategeonsoftwares.com' },
            { file: 'hms.jpg', url: 'https://hospital-management-system-react-ap.vercel.app' },
          ];
          (async () => {
            const b = await chromium.launch();
            for (const s of sites) {
              const p = await b.newPage({ viewport: { width: 1440, height: 900 } });
              await p.goto(s.url, { waitUntil: 'networkidle', timeout: 60000 });
              await p.waitForTimeout(6000);
              await p.screenshot({ path: out + s.file, type: 'jpeg', quality: 82 });
              await p.close();
            }
            await b.close();
          })();
          JS
          node /tmp/shot/shoot.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/*.jpg
          git diff --cached --quiet || (git commit -m "Update screenshots from the live sites" && git push)
